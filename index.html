    <title>Sarinna Thai Massage | Luxury Bangkok Spa</title>
    <!-- Keeping Tailwind CDN as requested for styling consistency -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
            },
            colors: {
              primary: '#5D4037', // Deep Earth Brown (Logo Background)
              accent: '#C5A059', // Champagne Gold (Logo Text)
              cream: '#FDFBF7', // Warm Off-White
              charcoal: '#3E2723', // Very Dark Warm Brown/Black
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FDFBF7;
        color: #3E2723;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .glass-dark {
        background: rgba(93, 64, 55, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
    </style>
